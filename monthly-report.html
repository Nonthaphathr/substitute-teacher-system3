<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานข้อมูลสถิติการจัดสอนแทนประจำเดือน</title>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');

        /* TH Sarabun New Font */
        @font-face {
            font-family: 'THSarabunNew';
            src: url('fonts/thsarabunnew-webfont.eot');
            src: url('fonts/thsarabunnew-webfont.eot?#iefix') format('embedded-opentype'),
                 url('fonts/thsarabunnew-webfont.woff') format('woff'),
                 url('fonts/thsarabunnew-webfont.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'THSarabunNew';
            src: url('fonts/thsarabunnew_bold-webfont.eot');
            src: url('fonts/thsarabunnew_bold-webfont.eot?#iefix') format('embedded-opentype'),
                 url('fonts/thsarabunnew_bold-webfont.woff') format('woff'),
                 url('fonts/thsarabunnew_bold-webfont.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #334155;
        }

        /* --- Control Panel --- */
        .control-panel {
            max-width: 850px;
            margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            animation: fadeSlideIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn-home {
            background: #fff;
            color: #64748b;
            border: 1px solid #e2e8f0;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-home:hover {
            background: #f1f5f9;
            color: #334155;
            transform: translateX(-2px);
        }

        .control-panel h2 {
            color: #1e3a8a;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.8rem;
        }

        .form-group { margin-bottom: 24px; }
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #475569;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: 'Sarabun', sans-serif;
            font-size: 1rem;
            background: #f8fafc;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .btn-generate {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(37, 99, 235, 0.4);
        }

        /* --- A4 Paper & Report Styles --- */
        .a4-paper {
            width: 210mm;
            min-height: 297mm;
            height: 297mm;
            background: white;
            padding: 20mm;
            margin: 0 auto 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            font-family: 'THSarabunNew', sans-serif;
            color: black;
            position: relative;
            overflow: hidden;
            min-width: 210mm;
        }

        /* Cover Page */
        .cover-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 257mm;
            text-align: center;
        }
        .cover-logos {
            display: flex;
            gap: 40px;
            margin-bottom: 40px;
            align-items: center;
        }
        .cover-logo { width: 120px; height: 120px; }
        .cover-title {
            font-size: 24pt;
            font-weight: bold;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .cover-subtitle {
            font-size: 18pt;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .cover-author {
            margin-top: 60px;
            font-size: 16pt;
            line-height: 1.8;
        }

        /* Memo Page */
        .memo-layout { 
            font-family: 'THSarabunNew', sans-serif !important;
            position: relative;
            min-height: 297mm;
            padding: 10mm 15mm 25mm 20mm;
        }
        .memo-layout .doc-header { 
            position: relative; 
            margin-bottom: 2px; 
        }
        .memo-layout .garuda { 
            position: absolute; 
            left: 0; 
            top: 0; 
            width: 1.3cm; 
            height: auto; 
        }
        .memo-layout .doc-title { 
            text-align: center; 
            font-size: 20pt; 
            font-weight: bold; 
            padding-top: 5mm; 
            margin-bottom: 2mm; 
        }
        .memo-layout .doc-meta { 
            font-size: 11pt;
            line-height: 1.4; 
            margin-bottom: 1px; 
            white-space: nowrap; 
        }
        .memo-layout .doc-meta-row { 
            display: flex; 
            justify-content: flex-start;
            gap: 0;
        }
        .memo-layout .doc-meta-row .doc-ref { 
            flex: 0 0 50%;
        }
        .memo-layout .doc-meta-row .doc-date { 
            flex: 0 0 50%;
            text-align: left;
            padding-left: 10px;
        }
        .memo-layout .doc-line { 
            border: none; 
            border-bottom: 1px solid black; 
            margin: 2px 0 8px 0; 
        }
        .memo-layout .doc-to { 
            font-size: 11pt;
            font-weight: bold; 
            font-style: italic; 
            margin-bottom: 2px; 
            line-height: 1.4; 
        }
        .memo-layout .doc-content { 
            font-size: 11pt;
            text-indent: 2.5cm; 
            text-align: justify; 
            line-height: 1.5; 
            margin-bottom: 2px; 
        }
        .memo-layout .doc-closing { 
            font-size: 11pt;
            text-indent: 2.5cm; 
            margin-top: 8px; 
            margin-bottom: 15px; 
            line-height: 1.4; 
        }
        
        .memo-layout .sign-section { 
            margin-top: 20px;
        }
        
        .memo-layout .sign-container {
            width: 50%;
            margin-left: 50%; /* เริ่มกึ่งกลางกระดาษ */
            padding-left: 10px; 
        }

        .memo-layout .sign-item { 
            margin-bottom: 25px;
            text-align: left;
            font-size: 11pt;
            line-height: 1.4;
        }
        
        .memo-layout .sign-center-text {
            text-align: center;
            width: 100%;
        }
        
        /* สไตล์สำหรับเส้นประ */
        .memo-layout .dotted-line-block {
            margin: 12px 0; /* เพิ่มระยะห่างบนล่างให้เขียนง่ายขึ้น */
        }

        /* =========================================
           Stats Page (แก้ไขใหม่ตามคำแนะนำ)
           ========================================= */
        .stats-page {
            font-size: 12pt; /* ลดจาก 14pt */
            line-height: 1.4;
        }
        .stats-title {
            text-align: center;
            font-size: 16pt; /* ลดจาก 18pt */
            font-weight: bold;
            margin-bottom: 12px; /* ลดจาก 20px */
            padding-bottom: 5px; /* ลดจาก 10px */
            border-bottom: 2px solid #333;
        }
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* เปลี่ยนเป็น 4 คอลัมน์แถวเดียว */
            gap: 10px; /* ลด gap */
            margin-bottom: 15px; /* ลด margin-bottom */
        }
        .stat-card {
            background: #f8fafc;
            padding: 10px; /* ลด padding */
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        .stat-card h3 {
            font-size: 12pt;
            color: #1e3a8a;
            margin-bottom: 5px;
            white-space: nowrap;
        }
        .stat-card .stat-value {
            font-size: 20pt; /* ลดจาก 24pt */
            font-weight: bold;
            color: #2563eb;
            line-height: 1.2;
        }
        .top-teachers { 
            margin-top: 15px; /* ลดจาก 30px */
            page-break-inside: avoid;
        }
        .top-teachers h3 {
            font-size: 14pt; /* ลดจาก 16pt */
            font-weight: bold;
            margin-bottom: 8px; /* ลดจาก 15px */
            color: #1e3a8a;
            border-left: 4px solid #1e3a8a;
            padding-left: 10px;
        }
        .top-list {
            background: #fff;
            padding: 0;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            /* เพิ่ม max-height เพื่อป้องกันการล้น */
            max-height: 300px; 
            overflow: hidden;
        }
        .top-item {
            padding: 6px 10px; /* ลด padding */
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            font-size: 12pt; /* ลด font-size */
        }
        .top-item:last-child { border-bottom: none; }
        .top-item:nth-child(even) { background-color: #f8fafc; }

        /* Print Styles */
        @media print {
            @page { 
                size: A4; 
                margin: 0mm; 
            }
            body { 
                background: white; 
                padding: 0; 
                margin: 0;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .control-panel,
            .no-print {
                display: none !important;
            }
            .a4-paper {
                margin: 0;
                padding: 8mm 12mm 8mm 18mm;
                width: 210mm;
                height: 280mm;
                box-shadow: none;
                border: none;
                page-break-after: always;
                page-break-inside: avoid;
                min-width: auto;
                position: relative;
                overflow: hidden;
            }
            .a4-paper:last-child {
                page-break-after: auto;
            }
            /* บังคับ CSS สำหรับหน้าสถิติเวลาพิมพ์ */
            .stats-page {
                font-size: 12pt !important;
            }
            .top-list {
                border: 1px solid #999;
            }
        }

        /* Floating Buttons */
        .print-buttons {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
            z-index: 1000;
        }
        .btn-action {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-print { background: #059669; color: white; }
        .btn-print:hover { transform: translateY(-3px); background: #047857; }
        .btn-back { background: #475569; color: white; }
        .btn-back:hover { transform: translateY(-3px); background: #334155; }

        /* Loading */
        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="control-panel" id="controlPanel">
        <div class="header-row">
            <a href="index.html" class="btn-home"><i class="fas fa-home"></i> กลับหน้าหลัก</a>
            <h2><i class="fas fa-chart-pie"></i> สร้างรายงานสรุปการสอนแทน</h2>
        </div>
        
        <div class="form-group">
            <label><i class="fas fa-user-pen"></i> ชื่อ-นามสกุล ผู้พิมพ์รายงาน</label>
            <input type="text" id="reportAuthor" placeholder="เช่น นายนนทพัทธ์ หิรัญเรือง" value="นายนนทพัทธ์ หิรัญเรือง">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>เดือน</label>
                <select id="reportMonth">
                    <option value="">-- เลือกเดือน --</option>
                    <option value="มกราคม">มกราคม</option>
                    <option value="กุมภาพันธ์">กุมภาพันธ์</option>
                    <option value="มีนาคม">มีนาคม</option>
                    <option value="เมษายน">เมษายน</option>
                    <option value="พฤษภาคม">พฤษภาคม</option>
                    <option value="มิถุนายน">มิถุนายน</option>
                    <option value="กรกฎาคม">กรกฎาคม</option>
                    <option value="สิงหาคม">สิงหาคม</option>
                    <option value="กันยายน">กันยายน</option>
                    <option value="ตุลาคม">ตุลาคม</option>
                    <option value="พฤศจิกายน">พฤศจิกายน</option>
                    <option value="ธันวาคม">ธันวาคม</option>
                </select>
            </div>

            <div class="form-group">
                <label>ภาคเรียน</label>
                <select id="reportSemester">
                    <option value="">-- เลือกภาคเรียน --</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>
            </div>

            <div class="form-group">
                <label>ปีการศึกษา (พ.ศ.)</label>
                <input type="number" id="reportYear" placeholder="เช่น 2568" min="2560" max="2580">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>เลือกช่วงวันที่ (เริ่มต้น)</label>
                <input type="date" id="startDate">
            </div>

            <div class="form-group">
                <label>เลือกช่วงวันที่ (สิ้นสุด)</label>
                <input type="date" id="endDate">
            </div>
        </div>

        <button class="btn-generate" onclick="generateReport()">
            <i class="fas fa-file-pdf"></i> สร้างรายงาน
        </button>
    </div>

    <div id="reportContainer" style="display: none;"></div>

    <div class="print-buttons no-print" id="printButtons" style="display: none;">
        <button class="btn-action btn-back" onclick="backToForm()"><i class="fas fa-arrow-left"></i> กลับไปแก้ไข</button>
        <button class="btn-action btn-print" onclick="window.print()"><i class="fas fa-print"></i> พิมพ์รายงาน</button>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCF7qDDxp6NXk3y7wLiySasqoviGyCKNNw",
            authDomain: "sornthan-fc0f1.firebaseapp.com",
            projectId: "sornthan-fc0f1",
            storageBucket: "sornthan-fc0f1.firebasestorage.app",
            messagingSenderId: "915683105444",
            appId: "1:915683105444:web:c1add040ea1afb344ae431"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let reportData = {};

        // คำนวณภาคเรียนปัจจุบันจากวันที่วันนี้ (ไม่ใช้ค่า hardcode เพื่อไม่ให้ค้างปีเก่า)
        // พ.ค.-ต.ค. = ภาคเรียนที่ 1 ของปีการศึกษานั้น, พ.ย.-เม.ย. = ภาคเรียนที่ 2
        function getCurrentSemesterBE() {
            const today = new Date();
            const month = today.getMonth() + 1; // 1-12
            let yearBE = today.getFullYear() + 543;
            let sem;
            if(month >= 5 && month <= 10) {
                sem = 1;
            } else if(month >= 11) {
                sem = 2;
            } else {
                sem = 2;
                yearBE -= 1;
            }
            return { sem, yearBE };
        }

        window.onload = () => {
            const today = new Date();
            const currentMonth = today.getMonth();
            const monthNames = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                              'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
            document.getElementById('reportMonth').value = monthNames[currentMonth];

            const firstDay = new Date(today.getFullYear(), currentMonth, 1);
            const lastDay = new Date(today.getFullYear(), currentMonth + 1, 0);
            document.getElementById('startDate').valueAsDate = firstDay;
            document.getElementById('endDate').valueAsDate = lastDay;

            const { sem, yearBE } = getCurrentSemesterBE();
            document.getElementById('reportSemester').value = String(sem);
            document.getElementById('reportYear').value = yearBE;
        };

        async function generateReport() {
            const author = document.getElementById('reportAuthor').value.trim();
            const month = document.getElementById('reportMonth').value;
            const semester = document.getElementById('reportSemester').value;
            const year = document.getElementById('reportYear').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!author || !month || !semester || !year || !startDate || !endDate) {
                return Swal.fire({
                    icon: 'warning',
                    title: 'ข้อมูลไม่ครบ',
                    text: 'กรุณากรอกข้อมูลให้ครบถ้วน',
                    confirmButtonColor: '#2563eb'
                });
            }

            reportData = { author, month, semester, year, startDate, endDate };

            Swal.fire({
                title: 'กำลังประมวลผล...',
                html: '<div class="spinner"></div>กำลังดึงข้อมูลจากฐานข้อมูล',
                allowOutsideClick: false,
                showConfirmButton: false
            });

            try {
                const snap = await db.collection("substitutions")
                    .where("docDate", ">=", startDate)
                    .where("docDate", "<=", endDate)
                    .get();

                const allRecords = [];
                const subTeacherCount = {};
                const absentTeacherCount = {};
                const dateSet = new Set();

                snap.forEach(doc => {
                    const d = doc.data();
                    dateSet.add(d.docDate);
                    d.records.forEach(r => {
                        allRecords.push({ ...r, docDate: d.docDate });
                        subTeacherCount[r.sub] = (subTeacherCount[r.sub] || 0) + 1;
                        absentTeacherCount[r.absent] = (absentTeacherCount[r.absent] || 0) + 1;
                    });
                });

                reportData.records = allRecords;
                reportData.stats = {
                    totalRecords: allRecords.length,
                    totalDays: dateSet.size,
                    subTeacherCount: subTeacherCount,
                    absentTeacherCount: absentTeacherCount
                };

                Swal.close();

                if (allRecords.length === 0) {
                    return Swal.fire({
                        icon: 'info',
                        title: 'ไม่พบข้อมูล',
                        text: `ไม่มีข้อมูลการจัดสอนแทนในช่วงเวลานี้`,
                        confirmButtonColor: '#2563eb'
                    });
                }

                renderReport();
                document.getElementById('controlPanel').style.display = 'none';
                document.getElementById('reportContainer').style.display = 'block';
                document.getElementById('printButtons').style.display = 'flex';
                window.scrollTo(0, 0);

            } catch (e) {
                console.error("Error:", e);
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error');
            }
        }

        function renderReport() {
            const container = document.getElementById('reportContainer');
            container.innerHTML = generateCoverPage() + generateMemoPage() + generateStatsPage();
        }

        function generateCoverPage() {
            const { month, semester, year, author } = reportData;
            return `
                <div class="a4-paper">
                    <div class="cover-page">
                        <div class="cover-logos">
                            <img src="https://nonthaphathr.github.io/uploadimg/logoschool.png" class="cover-logo">
                            <img src="https://nonthaphathr.github.io/uploadimg/logosonthan.png" class="cover-logo">
                        </div>
                        <div class="cover-title">
                            รายงานข้อมูลสถิติการจัดสอนแทน<br>
                            ประจำเดือน${month}
                        </div>
                        <div class="cover-subtitle">
                            ภาคเรียนที่ ${semester} ปีการศึกษา ${year}
                        </div>
                        <div class="cover-author">
                            จัดทำโดย<br>
                            ${author}<br><br>
