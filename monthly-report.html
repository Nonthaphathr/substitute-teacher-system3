<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานข้อมูลสถิติการจัดสอนแทนประจำเดือน</title>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');

        /* TH Sarabun New Font */
        @font-face {
            font-family: 'THSarabunNew';
            src: url('fonts/thsarabunnew-webfont.eot');
            src: url('fonts/thsarabunnew-webfont.eot?#iefix') format('embedded-opentype'),
                 url('fonts/thsarabunnew-webfont.woff') format('woff'),
                 url('fonts/thsarabunnew-webfont.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'THSarabunNew';
            src: url('fonts/thsarabunnew_bold-webfont.eot');
            src: url('fonts/thsarabunnew_bold-webfont.eot?#iefix') format('embedded-opentype'),
                 url('fonts/thsarabunnew_bold-webfont.woff') format('woff'),
                 url('fonts/thsarabunnew_bold-webfont.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #334155;
        }

        /* --- Control Panel --- */
        .control-panel {
            max-width: 850px;
            margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            animation: fadeSlideIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn-home {
            background: #fff;
            color: #64748b;
            border: 1px solid #e2e8f0;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-home:hover {
            background: #f1f5f9;
            color: #334155;
            transform: translateX(-2px);
        }

        .control-panel h2 {
            color: #1e3a8a;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.8rem;
        }

        .form-group { margin-bottom: 24px; }
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #475569;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: 'Sarabun', sans-serif;
            font-size: 1rem;
            background: #f8fafc;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .btn-generate {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(37, 99, 235, 0.4);
        }

        /* --- A4 Paper & Report Styles --- */
        .a4-paper {
            width: 210mm;
            min-height: 297mm;
            height: 297mm;
            background: white;
            padding: 20mm;
            margin: 0 auto 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            font-family: 'THSarabunNew', sans-serif;
            color: black;
            position: relative;
            overflow: hidden;
            min-width: 210mm;
        }

        /* Cover Page */
        .cover-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 257mm;
            text-align: center;
        }
        .cover-logos {
            display: flex;
            gap: 40px;
            margin-bottom: 40px;
            align-items: center;
        }
        .cover-logo { width: 120px; height: 120px; }
        .cover-title {
            font-size: 24pt;
            font-weight: bold;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .cover-subtitle {
            font-size: 18pt;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .cover-author {
            margin-top: 60px;
            font-size: 16pt;
            line-height: 1.8;
        }

        /* Memo Page */
        .memo-layout { 
            font-family: 'THSarabunNew', sans-serif !important;
            position: relative;
            min-height: 297mm;
            padding: 10mm 15mm 25mm 20mm;
        }
        .memo-layout .doc-header { 
            position: relative; 
            margin-bottom: 2px; 
        }
        .memo-layout .garuda { 
            position: absolute; 
            left: 0; 
            top: 0; 
            width: 1.3cm; 
            height: auto; 
        }
        .memo-layout .doc-title { 
            text-align: center; 
            font-size: 20pt; 
            font-weight: bold; 
            padding-top: 5mm; 
            margin-bottom: 2mm; 
        }
        .memo-layout .doc-meta { 
            font-size: 11pt;
            line-height: 1.4; 
            margin-bottom: 1px; 
            white-space: nowrap; 
        }
        .memo-layout .doc-meta-row { 
            display: flex; 
            justify-content: flex-start;
            gap: 0;
        }
        .memo-layout .doc-meta-row .doc-ref { 
            flex: 0 0 50%;
        }
        .memo-layout .doc-meta-row .doc-date { 
            flex: 0 0 50%;
            text-align: left;
            padding-left: 10px;
        }
        .memo-layout .doc-line { 
            border: none; 
            border-bottom: 1px solid black; 
            margin: 2px 0 8px 0; 
        }
        .memo-layout .doc-to { 
            font-size: 11pt;
            font-weight: bold; 
            font-style: italic; 
            margin-bottom: 2px; 
            line-height: 1.4; 
        }
        .memo-layout .doc-content { 
            font-size: 11pt;
            text-indent: 2.5cm; 
            text-align: justify; 
            line-height: 1.5; 
            margin-bottom: 2px; 
        }
        .memo-layout .doc-closing { 
            font-size: 11pt;
            text-indent: 2.5cm; 
            margin-top: 8px; 
            margin-bottom: 15px; 
            line-height: 1.4; 
        }
        
        .memo-layout .sign-section { 
            margin-top: 20px;
        }
        
        .memo-layout .sign-container {
            width: 50%;
            margin-left: 50%; /* เริ่มกึ่งกลางกระดาษ */
            padding-left: 10px; 
        }

        .memo-layout .sign-item { 
            margin-bottom: 25px;
            text-align: left;
            font-size: 11pt;
            line-height: 1.4;
        }
        
        .memo-layout .sign-center-text {
            text-align: center;
            width: 100%;
        }
        
        /* สไตล์สำหรับเส้นประ */
        .memo-layout .dotted-line-block {
            margin: 12px 0; /* เพิ่มระยะห่างบนล่างให้เขียนง่ายขึ้น */
        }

        /* =========================================
           Stats Page (แก้ไขใหม่ตามคำแนะนำ)
           ========================================= */
        .stats-page {
            font-size: 12pt; /* ลดจาก 14pt */
            line-height: 1.4;
        }
        .stats-title {
            text-align: center;
            font-size: 16pt; /* ลดจาก 18pt */
            font-weight: bold;
            margin-bottom: 12px; /* ลดจาก 20px */
            padding-bottom: 5px; /* ลดจาก 10px */
            border-bottom: 2px solid #333;
        }
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* เปลี่ยนเป็น 4 คอลัมน์แถวเดียว */
            gap: 10px; /* ลด gap */
            margin-bottom: 15px; /* ลด margin-bottom */
        }
        .stat-card {
            background: #f8fafc;
            padding: 10px; /* ลด padding */
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        .stat-card h3 {
            font-size: 12pt;
            color: #1e3a8a;
            margin-bottom: 5px;
            white-space: nowrap;
        }
        .stat-card .stat-value {
            font-size: 20pt; /* ลดจาก 24pt */
            font-weight: bold;
            color: #2563eb;
            line-height: 1.2;
        }
        .top-teachers { 
            margin-top: 15px; /* ลดจาก 30px */
            page-break-inside: avoid;
        }
        .top-teachers h3 {
            font-size: 14pt; /* ลดจาก 16pt */
            font-weight: bold;
            margin-bottom: 8px; /* ลดจาก 15px */
            color: #1e3a8a;
            border-left: 4px solid #1e3a8a;
            padding-left: 10px;
        }
        .top-list {
            background: #fff;
            padding: 0;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            /* เพิ่ม max-height เพื่อป้องกันการล้น */
            max-height: 300px; 
            overflow: hidden;
        }
        .top-item {
            padding: 6px 10px; /* ลด padding */
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            font-size: 12pt; /* ลด font-size */
        }
        .top-item:last-child { border-bottom: none; }
        .top-item:nth-child(even) { background-color: #f8fafc; }


        /* =========================================
           ตารางสรุปรวบยอดรายเดือน (แนวนอน A4)
           ========================================= */
        .a4-paper.a4-land {
            width: 297mm; min-width: 297mm;
            height: 210mm; min-height: 210mm;
            padding: 8mm 10mm 6mm 10mm;
            display: flex; flex-direction: column;
        }
        .land-head { text-align: center; line-height: 1.25; margin-bottom: 3mm; flex: 0 0 auto; }
        .land-head .t1 { font-size: 16pt; font-weight: bold; }
        .land-head .t2 { font-size: 13pt; }
        .land-page-no { text-align: right; font-size: 11pt; flex: 0 0 auto; height: 5mm; line-height: 5mm; }
        .month-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 11.5pt; line-height: 1.15; }
        .month-table th, .month-table td { border: 1px solid #000; padding: 0.8mm 1.2mm; vertical-align: middle; text-align: center; word-wrap: break-word; overflow-wrap: anywhere; }
        .month-table th { font-weight: bold; background: #f1f5f9; }
        .month-table td.text-left { text-align: left; }
        .month-table td.sign-cell { height: 12mm; }
        .month-table .small { font-size: 10.5pt; }
        .month-table .muted { color: #666; font-style: italic; }
        .month-table tr.redirect-row td { background: #fffbeb; }
        .month-table tr.total-row td { font-weight: bold; background: #f8fafc; }
        .land-foot-sign { margin-top: 4mm; font-size: 12pt; display: flex; justify-content: flex-end; }
        .land-foot-sign div { width: 90mm; text-align: center; line-height: 1.35; }
        .measure-box { position: absolute; left: -99999px; top: 0; visibility: hidden; }

        /* Print Styles */
        @media print {
            @page { 
                size: A4; 
                margin: 0mm; 
            }
            body { 
                background: white; 
                padding: 0; 
                margin: 0;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .control-panel,
            .no-print {
                display: none !important;
            }
            .a4-paper {
                margin: 0;
                padding: 8mm 12mm 8mm 18mm;
                width: 210mm;
                height: 280mm;
                box-shadow: none;
                border: none;
                page-break-after: always;
                page-break-inside: avoid;
                min-width: auto;
                position: relative;
                overflow: hidden;
            }
            .a4-paper:last-child {
                page-break-after: auto;
            }
            .a4-paper.a4-land {
                page: land;
                width: 297mm; min-width: auto;
                height: 205mm; min-height: 0;
                padding: 8mm 10mm 5mm 10mm;
            }
            @page land { size: A4 landscape; margin: 0; }
            /* บังคับ CSS สำหรับหน้าสถิติเวลาพิมพ์ */
            .stats-page {
                font-size: 12pt !important;
            }
            .top-list {
                border: 1px solid #999;
            }
        }

        /* Floating Buttons */
        .print-buttons {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
            z-index: 1000;
        }
        .btn-action {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-print { background: #059669; color: white; }
        .btn-print:hover { transform: translateY(-3px); background: #047857; }
        .btn-back { background: #475569; color: white; }
        .btn-back:hover { transform: translateY(-3px); background: #334155; }

        /* Loading */
        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="control-panel" id="controlPanel">
        <div class="header-row">
            <a href="index.html" class="btn-home"><i class="fas fa-home"></i> กลับหน้าหลัก</a>
            <h2><i class="fas fa-chart-pie"></i> สร้างรายงานสรุปการสอนแทน</h2>
        </div>
        
        <div class="form-group">
            <label><i class="fas fa-user-pen"></i> ชื่อ-นามสกุล ผู้พิมพ์รายงาน</label>
            <input type="text" id="reportAuthor" placeholder="เช่น นายนนทพัทธ์ หิรัญเรือง" value="นายนนทพัทธ์ หิรัญเรือง">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>เดือน</label>
                <select id="reportMonth">
                    <option value="">-- เลือกเดือน --</option>
                    <option value="มกราคม">มกราคม</option>
                    <option value="กุมภาพันธ์">กุมภาพันธ์</option>
                    <option value="มีนาคม">มีนาคม</option>
                    <option value="เมษายน">เมษายน</option>
                    <option value="พฤษภาคม">พฤษภาคม</option>
                    <option value="มิถุนายน">มิถุนายน</option>
                    <option value="กรกฎาคม">กรกฎาคม</option>
                    <option value="สิงหาคม">สิงหาคม</option>
                    <option value="กันยายน">กันยายน</option>
                    <option value="ตุลาคม">ตุลาคม</option>
                    <option value="พฤศจิกายน">พฤศจิกายน</option>
                    <option value="ธันวาคม">ธันวาคม</option>
                </select>
            </div>

            <div class="form-group">
                <label>ภาคเรียน</label>
                <select id="reportSemester">
                    <option value="">-- เลือกภาคเรียน --</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>
            </div>

            <div class="form-group">
                <label>ปีการศึกษา (พ.ศ.)</label>
                <input type="number" id="reportYear" placeholder="เช่น 2568" min="2560" max="2580">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>เลือกช่วงวันที่ (เริ่มต้น)</label>
                <input type="date" id="startDate">
            </div>

            <div class="form-group">
                <label>เลือกช่วงวันที่ (สิ้นสุด)</label>
                <input type="date" id="endDate">
            </div>
        </div>

        <div class="form-group" style="margin-bottom:10px">
            <label><i class="fas fa-layer-group"></i> เอกสารที่ต้องการพิมพ์</label>
            <div style="display:flex; gap:22px; flex-wrap:wrap; font-size:0.95rem;">
                <label style="font-weight:500"><input type="checkbox" id="optCover"> หน้าปก</label>
                <label style="font-weight:500"><input type="checkbox" id="optStats" checked> หน้าสถิติสรุป (แนบท้าย)</label>
            </div>
            <div style="font-size:0.85rem; color:#64748b; margin-top:6px">ชุดเอกสาร: บันทึกข้อความปะหน้า + ตารางสรุปรวบยอดรายเดือน (พร้อมช่องลงนามครูผู้สอนแทน) เสนอผู้อำนวยการเดือนละครั้ง</div>
        </div>

        <button class="btn-generate" onclick="generateReport()">
            <i class="fas fa-file-pdf"></i> สร้างรายงาน
        </button>
    </div>

    <div id="reportContainer" style="display: none;"></div>

    <div class="print-buttons no-print" id="printButtons" style="display: none;">
        <button class="btn-action btn-back" onclick="backToForm()"><i class="fas fa-arrow-left"></i> กลับไปแก้ไข</button>
        <button class="btn-action btn-print" onclick="window.print()"><i class="fas fa-print"></i> พิมพ์รายงาน</button>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCF7qDDxp6NXk3y7wLiySasqoviGyCKNNw",
            authDomain: "sornthan-fc0f1.firebaseapp.com",
            projectId: "sornthan-fc0f1",
            storageBucket: "sornthan-fc0f1.firebasestorage.app",
            messagingSenderId: "915683105444",
            appId: "1:915683105444:web:c1add040ea1afb344ae431"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let reportData = {};

        // คำนวณภาคเรียนปัจจุบันจากวันที่วันนี้ (ไม่ใช้ค่า hardcode เพื่อไม่ให้ค้างปีเก่า)
        // พ.ค.-ต.ค. = ภาคเรียนที่ 1 ของปีการศึกษานั้น, พ.ย.-เม.ย. = ภาคเรียนที่ 2
        function getCurrentSemesterBE() {
            const today = new Date();
            const month = today.getMonth() + 1; // 1-12
            let yearBE = today.getFullYear() + 543;
            let sem;
            if(month >= 5 && month <= 10) {
                sem = 1;
            } else if(month >= 11) {
                sem = 2;
            } else {
                sem = 2;
                yearBE -= 1;
            }
            return { sem, yearBE };
        }

        window.onload = () => {
            const today = new Date();
            const currentMonth = today.getMonth();
            const monthNames = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                              'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
            document.getElementById('reportMonth').value = monthNames[currentMonth];

            const firstDay = new Date(today.getFullYear(), currentMonth, 1);
            const lastDay = new Date(today.getFullYear(), currentMonth + 1, 0);
            document.getElementById('startDate').valueAsDate = firstDay;
            document.getElementById('endDate').valueAsDate = lastDay;

            const { sem, yearBE } = getCurrentSemesterBE();
            document.getElementById('reportSemester').value = String(sem);
            document.getElementById('reportYear').value = yearBE;
        };

        async function generateReport() {
            const author = document.getElementById('reportAuthor').value.trim();
            const month = document.getElementById('reportMonth').value;
            const semester = document.getElementById('reportSemester').value;
            const year = document.getElementById('reportYear').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!author || !month || !semester || !year || !startDate || !endDate) {
                return Swal.fire({
                    icon: 'warning',
                    title: 'ข้อมูลไม่ครบ',
                    text: 'กรุณากรอกข้อมูลให้ครบถ้วน',
                    confirmButtonColor: '#2563eb'
                });
            }

            reportData = { author, month, semester, year, startDate, endDate };

            Swal.fire({
                title: 'กำลังประมวลผล...',
                html: '<div class="spinner"></div>กำลังดึงข้อมูลจากฐานข้อมูล',
                allowOutsideClick: false,
                showConfirmButton: false
            });

            try {
                const snap = await db.collection("substitutions")
                    .where("docDate", ">=", startDate)
                    .where("docDate", "<=", endDate)
                    .get();

                const allRecords = [];
                const subTeacherCount = {};
                const absentTeacherCount = {};
                const dateSet = new Set();

                snap.forEach(doc => {
                    const d = doc.data();
                    dateSet.add(d.docDate);
                    (d.records || []).forEach(r => {
                        const rep = d.reports ? d.reports[reportKey(r)] : null;
                        allRecords.push({ ...r, docDate: d.docDate, daySchedule: d.daySchedule || '', report: rep || null });
                        if(!r.redirect) subTeacherCount[r.sub] = (subTeacherCount[r.sub] || 0) + 1;
                        absentTeacherCount[r.absent] = (absentTeacherCount[r.absent] || 0) + 1;
                    });
                });
                allRecords.sort((a, b) => (a.docDate === b.docDate ? a.period - b.period : a.docDate < b.docDate ? -1 : 1));

                reportData.records = allRecords;
                reportData.stats = {
                    totalRecords: allRecords.length,
                    totalDays: dateSet.size,
                    subTeacherCount: subTeacherCount,
                    absentTeacherCount: absentTeacherCount
                };

                Swal.close();

                if (allRecords.length === 0) {
                    return Swal.fire({
                        icon: 'info',
                        title: 'ไม่พบข้อมูล',
                        text: `ไม่มีข้อมูลการจัดสอนแทนในช่วงเวลานี้`,
                        confirmButtonColor: '#2563eb'
                    });
                }

                await renderReport();
                document.getElementById('controlPanel').style.display = 'none';
                document.getElementById('reportContainer').style.display = 'block';
                document.getElementById('printButtons').style.display = 'flex';
                window.scrollTo(0, 0);

            } catch (e) {
                console.error("Error:", e);
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error');
            }
        }

        // คีย์ของรายงานจากครูสอนแทน (ต้องตรงกับ index.html และ sub-report.html)
        function reportKey(r) {
            return `${r.period}|${r.sub}|${r.absent}`.replace(/[.\/\[\]*`~]/g, '_');
        }
        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        const THAI_MONTHS_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
        function shortThaiDate(d) {
            const p = (d || '').split('-');
            if(p.length < 3) return d || '';
            return `${parseInt(p[2])} ${THAI_MONTHS_SHORT[parseInt(p[1]) - 1]} ${String(parseInt(p[0]) + 543).slice(-2)}`;
        }

        async function renderReport() {
            const container = document.getElementById('reportContainer');
            // โหลดฟอนต์ THSarabunNew ให้เสร็จก่อนวัดความสูงแถว (ไม่งั้นแบ่งหน้าผิด)
            if(document.fonts) {
                try {
                    await Promise.all([document.fonts.load('12pt THSarabunNew', 'ก'), document.fonts.load('bold 12pt THSarabunNew', 'ก')]);
                    await document.fonts.ready;
                } catch(e) { console.warn('font preload', e); }
            }
            container.innerHTML = '';
            const summary = buildSummaryPages(container);   // ต้องวัดความสูงจริง จึงสร้างในคอนเทนเนอร์
            const parts = [];
            if(document.getElementById('optCover').checked) parts.push(generateCoverPage());
            parts.push(generateMemoPage(summary.pageCount));
            container.innerHTML = parts.join('') + summary.html
                + (document.getElementById('optStats').checked ? generateStatsPage() : '');
        }

        // ตารางสรุปรวบยอด: แบ่งหน้าด้วยการวัดความสูงจริงของแต่ละแถว
        function buildSummaryPages(container) {
            const { month, semester, year, author, records } = reportData;
            const colgroup = `<colgroup>
                <col style="width:3%"><col style="width:9.5%"><col style="width:3.5%"><col style="width:13%"><col style="width:14%">
                <col style="width:13%"><col style="width:17%"><col style="width:16%"><col style="width:11%">
            </colgroup>`;
            const thead = `<thead><tr>
                <th>ที่</th><th>วัน/เดือน/ปี</th><th>คาบ</th><th>ครูผู้ลา/ไปราชการ<br><span class="small">(สาเหตุ)</span></th><th>วิชา / ชั้น</th>
                <th>ครูผู้สอนแทน</th><th>ภาระงานที่มอบหมาย</th><th>นักเรียนที่ไม่เข้าเรียน</th><th>ลงนามครูผู้สอนแทน</th>
            </tr></thead>`;

            const rowHtml = (r, i) => {
                const rep = r.report;
                const subj = [r.subject && r.subject !== '-' ? r.subject : '', r.subjectName || ''].filter(Boolean).join(' ');
                const gradeTxt = r.grade && r.grade !== '-' ? r.grade : '';
                const subjCell = `<b>${esc(r.subject && r.subject !== '-' ? r.subject : '-')}</b> ${esc(gradeTxt)}${r.subjectName ? '<br><span class="small">' + esc(r.subjectName) + '</span>' : ''}`;
                const dateCell = `${shortThaiDate(r.docDate)}${r.daySchedule ? '<br><span class="small">' + esc(r.daySchedule) + '</span>' : ''}`;
                const absentCell = `${esc(r.absent)}<br><span class="small">(${esc(r.reason || '')})</span>`;
                if(r.redirect) {
                    const vis = [r.redirectCode, r.redirectName].filter(Boolean).join(' ');
                    return `<tr class="redirect-row">
                        <td>${i + 1}</td><td>${dateCell}</td><td>${esc(r.period)}</td><td class="text-left">${absentCell}</td><td>${subjCell}</td>
                        <td class="text-left small">นักเรียนไปเรียน ${esc(vis || 'วิชาเพิ่มเติม')} กับ ${esc(r.sub)}</td>
                        <td class="muted small">ไม่มีการสอนแทน</td><td class="muted small">—</td><td class="sign-cell"></td>
                    </tr>`;
                }
                let work = '<span class="muted small">ยังไม่ได้รายงาน</span>';
                let stu = '<span class="muted small">—</span>';
                if(rep) {
                    work = `<span class="small">${esc(rep.workload || '-').replace(/\n/g, '<br>')}</span>`;
                    if(rep.note) work += `<br><span class="small muted">หมายเหตุ: ${esc(rep.note)}</span>`;
                    const list = rep.absentStudents || [];
                    stu = list.length === 0
                        ? '<span class="small">มาครบทุกคน</span>'
                        : `<span class="small"><b>ขาด ${list.length} คน</b><br>${list.map(x => esc((x.no ? x.no + ' ' : '') + x.name)).join(', ')}</span>`;
                }
                return `<tr>
                    <td>${i + 1}</td><td>${dateCell}</td><td>${esc(r.period)}</td><td class="text-left">${absentCell}</td><td>${subjCell}</td>
                    <td class="text-left">${esc(r.sub)}</td><td class="text-left">${work}</td><td class="text-left">${stu}</td><td class="sign-cell"></td>
                </tr>`;
            };

            const subCount = records.filter(r => !r.redirect).length;
            const redirCount = records.length - subCount;
            const totalRow = `<tr class="total-row"><td colspan="9" class="text-left">
                รวมทั้งสิ้น ${records.length} รายการ (สอนแทน ${subCount} คาบ${redirCount ? ' • ให้นักเรียนไปเรียนกับครูวิชาเพิ่มเติม ' + redirCount + ' คาบ' : ''})</td></tr>`;
            const rowsAll = records.map((r, i) => rowHtml(r, i)).concat([totalRow]);

            // ---- วัดและแบ่งหน้า ----
            const box = document.createElement('div');
            box.className = 'measure-box';
            document.body.appendChild(box);   // ต้องอยู่ใน body ที่แสดงผลอยู่ จึงจะวัดความสูงได้

            const pages = [];
            const newPage = () => {
                const p = document.createElement('div');
                p.className = 'a4-paper a4-land';
                p.innerHTML = `
                    <div class="land-head">
                        <div class="t1">ตารางสรุปการจัดสอนแทน ประจำเดือน${esc(month)} ภาคเรียนที่ ${esc(semester)} ปีการศึกษา ${esc(year)}</div>
                        <div class="t2">โรงเรียนกระดุมทองวิทยา อำเภอกันทรารมย์ จังหวัดศรีสะเกษ</div>
                    </div>
                    <div class="land-page-no"></div>
                    <table class="month-table">${colgroup}${thead}<tbody></tbody></table>`;
                box.appendChild(p);
                pages.push(p);
                return p;
            };
            let page = newPage();
            rowsAll.forEach(html => {
                const tbody = page.querySelector('tbody');
                tbody.insertAdjacentHTML('beforeend', html);
                if(page.scrollHeight > page.clientHeight + 1 && tbody.children.length > 1) {
                    const last = tbody.lastElementChild;
                    tbody.removeChild(last);
                    page = newPage();
                    page.querySelector('tbody').appendChild(last);
                }
            });
            // ช่องลงนามผู้จัดทำ ท้ายตาราง
            const foot = document.createElement('div');
            foot.className = 'land-foot-sign';
            foot.innerHTML = `<div>ลงชื่อ........................................ผู้จัดทำรายงาน<br>(${esc(author)})<br>งานพัฒนากระบวนการเรียนรู้</div>`;
            page.appendChild(foot);
            if(page.scrollHeight > page.clientHeight + 1) {
                // ส่วนลงนามไม่พอดีหน้า: ดันแถวท้ายตาราง (สูงสุด 2 แถว รวมแถวสรุป) ไปหน้าใหม่พร้อมส่วนลงนาม ไม่ให้หน้าสุดท้ายมีแต่ชื่อเดี่ยว ๆ
                page.removeChild(foot);
                const tb = page.querySelector('tbody');
                const moved = [];
                const n = Math.min(2, tb.children.length - 1);
                for(let i = 0; i < n; i++) moved.unshift(tb.removeChild(tb.lastElementChild));
                page = newPage();
                const nb = page.querySelector('tbody');
                moved.forEach(tr => nb.appendChild(tr));
                page.appendChild(foot);
            }

            pages.forEach((p, i) => { p.querySelector('.land-page-no').textContent = `หน้า ${i + 1}/${pages.length}`; });
            const html = pages.map(p => p.outerHTML).join('');
            document.body.removeChild(box);
            return { html, pageCount: pages.length };
        }

                              'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

            return `

                        <div class="doc-title">บันทึกข้อความ</div>
                    </div>

                    </div>
                    <div class="doc-meta"><b>เรื่อง</b>&nbsp;&nbsp;รายงานข้อมูลสถิติการจัดสอนแทนประจำเดือน${month} ภาคเรียนที่ ${semester} ปีการศึกษา ${year}</div>

                    <div class="doc-content">ตามคำสั่งโรงเรียนกระดุมทองวิทยาที่ 39/2568 เรื่อง แต่งตั้งข้าราชการครูและบุคลากรทางการศึกษาปฏิบัติหน้าที่ตามพรรณนางาน ปีการศึกษา ${year} ได้กำหนดให้ผู้รับผิดชอบงานการพัฒนากระบวนการเรียนรู้กลุ่มบริหารงานวิชาการ มีหน้าที่จัดครูเข้าสอนแทน อย่างสม่ำเสมอ พร้อมสรุปรายงานการสอนแทน นั้น</div>
                    
                    <div class="doc-content">บัดนี้ ข้าพเจ้า ${author} ผู้รับผิดชอบงานการพัฒนากระบวนการเรียนรู้กลุ่มบริหารงานวิชาการ ได้ดำเนินการสรุปข้อมูลการจัดสอนแทน ประจำเดือน${month} ภาคเรียนที่ ${semester} ปีการศึกษา ${year} จากระบบช่วยจัดสอนแทน โรงเรียนกระดุมทองวิทยา เสร็จสิ้นเรียบร้อยแล้ว รวม ${reportData.stats.totalRecords} รายการ ใน ${reportData.stats.totalDays} วัน รายละเอียดภาระงานที่มอบหมาย การเข้าเรียนของนักเรียน และการลงนามของครูผู้สอนแทน ดังตารางสรุปที่แนบมาพร้อมนี้ จำนวน ${tablePages || 1} หน้า</div>
                    
                    <div class="doc-closing">จึงเรียนมาเพื่อโปรดทราบ</div>
                    
                    <div class="sign-section">
                        <div class="sign-container">
                            <div class="sign-item">
                                <div class="sign-center-text">
                                    ลงชื่อ........................................<br>
                                    (${author})<br>
                                    งานพัฒนากระบวนการเรียนรู้
                                </div>
                            </div>
                            
                            <div class="sign-item">
                                <div>ความเห็น หัวหน้ากลุ่มบริหารงานวิชาการ</div>
                                <div class="dotted-line-block">...........................................................................................</div>
                                <div class="sign-center-text">
                                    ลงชื่อ........................................<br>
                                    (นางสาวสุพัฒตา ศรีเมือง)<br>
                                    หัวหน้ากลุ่มบริหารงานวิชาการ
                                </div>
                            </div>
                            
                            <div class="sign-item">
                                <div>ความเห็น รองผู้อำนวยการโรงเรียน</div>
                                <div class="dotted-line-block">...........................................................................................</div>
                                <div class="sign-center-text">
                                    ลงชื่อ........................................<br>
                                    (นางสุคันทร บาอินทร์)<br>
                                    รองผู้อำนวยการโรงเรียนกระดุมทองวิทยา
                                </div>
                            </div>
                            
                            <div class="sign-item">
                                <div>ความเห็น ผู้อำนวยการโรงเรียน</div>
                                <div class="dotted-line-block">...........................................................................................</div>
                                <div class="sign-center-text">
                                    ลงชื่อ........................................<br>
                                    (นางสุนิสา ใจใหญ่)<br>
                                    ผู้อำนวยการโรงเรียนกระดุมทองวิทยา
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function generateStatsPage() {
            const { month, semester, year, stats } = reportData;
            
            // Limit to Top 8 to fit in page
            const topSubTeachers = Object.entries(stats.subTeacherCount)
                .sort((a, b) => b[1] - a[1]).slice(0, 8);
            const topAbsentTeachers = Object.entries(stats.absentTeacherCount)
                .sort((a, b) => b[1] - a[1]).slice(0, 8);

            return `
                <div class="a4-paper">
                    <div class="stats-page">
                        <div class="stats-title">
                            ตารางสรุปข้อมูลสถิติจากระบบสรุปสถิติการจัดสอนแทน<br>

                                <div class="stat-value">${stats.totalDays}</div>
                                <div>วัน</div>
                            </div>
                            <div class="stat-card">

                            </div>
                            <div class="stat-card">
                                <h3>📋 ครูรับการแทน</h3>
                                <div class="stat-value">${Object.keys(stats.absentTeacherCount).length}</div>
                                <div>คน</div>
                            </div>

                        <div class="top-teachers">

            document.getElementById('printButtons').style.display = 'none';
            window.scrollTo(0, 0);
        }
    </script>
</body>
